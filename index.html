            <!-- Sonrisa dulce -->
            <path d="M235 362 Q256 384 277 362" fill="none" stroke="#064e3b" stroke-width="11" stroke-linecap="round"/>
          </svg>
        `;

        const img = new Image();
        const svgBlob = new Blob([svgMarkup], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);

        img.onload = function () {
          const canvas = document.createElement('canvas');
          canvas.width = 512;
          canvas.height = 512;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, 512, 512);
          URL.revokeObjectURL(url);

          const pngDataUrl = canvas.toDataURL('image/png');

          const appleIcon = document.getElementById('dynamic-apple-icon');
          const favIcon = document.getElementById('dynamic-favicon');
          if (appleIcon) appleIcon.href = pngDataUrl;
          if (favIcon) favIcon.href = pngDataUrl;

          const manifestObj = {
            name: 'BrocoFood',
            short_name: 'BrocoFood',
            description: 'Tu brócoli chef para controlar despensa, recetario, presupuesto y hábitos diarios.',
            start_url: '.',
            display: 'standalone',
            background_color: '#f3f7f4',
            theme_color: '#059669',
            icons: [
              {
                src: pngDataUrl,
                sizes: '512x512',
                type: 'image/png',
                purpose: 'any maskable'
              }
            ]
          };

          const manifestLink = document.getElementById('dynamic-manifest');
          if (manifestLink) {
            manifestLink.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestObj));
          }
        };
        img.src = url;
      } catch (err) {
        console.warn('No se pudo generar el ícono dinámico:', err);
      }
    }

    // Utilidades de fechas locales YYYY-MM-DD
    function getTodayStr(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function addDaysToDateStr(dateStr, days) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      date.setDate(date.getDate() + Number(days));
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getDaysRemaining(expiryDateStr, fromDateStr = getTodayStr(0)) {
      const [y1, m1, d1] = fromDateStr.split('-').map(Number);
      const [y2, m2, d2] = expiryDateStr.split('-').map(Number);
      const t1 = new Date(y1, m1 - 1, d1).getTime();
      const t2 = new Date(y2, m2 - 1, d2).getTime();
      return Math.round((t2 - t1) / (1000 * 60 * 60 * 24));
    }

    function getDayInfo(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      const daysShort = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
      const daysFull = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
      const months = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
      const today = getTodayStr(0);
      const tomorrow = getTodayStr(1);

      let relativeLabel = `${daysFull[date.getDay()]} ${d} ${months[m - 1]}`;
      if (dateStr === today) relativeLabel = `Hoy · ${daysFull[date.getDay()]} ${d}`;
      else if (dateStr === tomorrow) relativeLabel = `Mañana · ${daysFull[date.getDay()]} ${d}`;

      return {
        dayShort: daysShort[date.getDay()],
        dayFull: daysFull[date.getDay()],
        dayNum: d,
        monthShort: months[m - 1],
        formatted: `${d} ${months[m - 1]}`,
        relativeLabel
      };
    }

    function formatNumber(num) {
      return Number.isInteger(num) ? num.toString() : Number(num.toFixed(2)).toString();

    function formatSoles(amount) {
      const val = Number(amount) || 0;

      while (true) {

    /**
     * ============================================================================
     * MODO "CERO FLOJERA": MOTOR DE SUGERENCIA INTELIGENTE DE RECETAS
     * ============================================================================
     * Analiza lotes en rojo (<= 1 día) y amarillo (<= 3 días) y busca qué receta
     * del usuario los aprovecha mejor teniendo todos los ingredientes completos.
     */
    function getZeroLazinessSuggestion() {
      const today = getTodayStr(0);

      // Detectar ingredientes urgentes (0 a 3 días de vida restante)
      const urgentLots = appState.pantry
        .filter(l => l.remainingUseQty > 0 && l.expiryDate >= today)
        .map(l => ({
          ...l,
          ingredient: getIngredient(l.ingredientId),
          daysLeft: getDaysRemaining(l.expiryDate)
        }))
        .filter(l => l.ingredient && l.daysLeft <= 3)
        .sort((a, b) => a.daysLeft - b.daysLeft);

      const urgentIngredientIds = new Set(urgentLots.map(l => l.ingredientId));

      if (appState.recipes.length === 0) return null;

      // Evaluar cada receta del catálogo
      const scoredRecipes = appState.recipes.map(recipe => {
        let hasAllIngredients = true;
        const missingNames = [];
        const savedUrgentNames = [];
        let urgencyScore = 0;

        recipe.ingredients.forEach(req => {
          const ing = getIngredient(req.ingredientId);
          if (!ing) return;
          const stock = getTotalStockForIngredient(ing.id);
          if (stock < req.qty) {
            hasAllIngredients = false;
            missingNames.push(ing.name);
          }
          if (urgentIngredientIds.has(ing.id)) {
            const minDays = Math.min(...urgentLots.filter(l => l.ingredientId === ing.id).map(l => l.daysLeft));
            // Más puntaje si vence hoy (0d) o mañana (1d)
            urgencyScore += (4 - minDays) * 10;
            if (!savedUrgentNames.includes(ing.name)) {
              savedUrgentNames.push(`${ing.name} (${minDays === 0 ? 'vence hoy' : minDays === 1 ? 'vence mañana' : `vence en ${minDays}d`})`);
            }
          }
        });

        // Bonus por recetas rápidas (<= 25 min) para días de flojera
        const speedBonus = (recipe.prepTimeMin && recipe.prepTimeMin <= 25) ? 5 : 0;

        return {
          recipe,
          hasAllIngredients,
          missingNames,
          savedUrgentNames,
          urgencyScore,
          totalScore: (hasAllIngredients ? 100 : 0) + urgencyScore + speedBonus
        };
      });

      // Ordenar priorizando las 100% completas que salvan ingredientes urgentes
      scoredRecipes.sort((a, b) => b.totalScore - a.totalScore);
      const best = scoredRecipes[0];
      if (!best) return null;

      return {
        best,
        allCandidates: scoredRecipes.filter(s => s.hasAllIngredients || s.urgencyScore > 0),
        urgentLots
      };
    }

    /**
     * ============================================================================
     * SIMULACIÓN CRONOLÓGICA DE STOCK POR DÍA EN EL CALENDARIO
     * ============================================================================
     */
    function simulateScheduleStock() {
      const today = getTodayStr(0);
      const endWindow = getTodayStr(6);

      const simLots = appState.pantry
        .filter(l => l.remainingUseQty > 0)
        .map(l => ({ ...l }))
        .sort((a, b) => a.expiryDate.localeCompare(b.expiryDate));

      const mealOrder = { 'Desayuno': 1, 'Almuerzo': 2, 'Cena': 3 };

      const upcomingMeals = appState.schedule
        .filter(s => s.status === 'planned' && s.date >= today && s.date <= endWindow)
        .sort((a, b) => {
          if (a.date !== b.date) return a.date.localeCompare(b.date);
          return (mealOrder[a.mealType] || 2) - (mealOrder[b.mealType] || 2);
        });

      const evaluationMap = {};

      upcomingMeals.forEach(item => {
        const recipe = getRecipe(item.recipeId);
        if (!recipe) {
          evaluationMap[item.id] = { ok: true, alerts: [] };
          return;
        }

        const alerts = [];

        recipe.ingredients.forEach(req => {
          const ing = getIngredient(req.ingredientId);
          if (!ing) return;

          let needed = req.qty;
          let expiredBeforeDate = false;

          const matchingLots = simLots.filter(l => l.ingredientId === req.ingredientId && l.remainingUseQty > 0);

          for (const lot of matchingLots) {
            if (needed <= 0) break;
            if (lot.expiryDate < item.date) {
              expiredBeforeDate = true;
              continue;
            }
            const take = Math.min(lot.remainingUseQty, needed);
            lot.remainingUseQty = Number((lot.remainingUseQty - take).toFixed(2));
            needed = Number((needed - take).toFixed(2));
          }

          if (needed > 0) {
            if (expiredBeforeDate) {
              alerts.push(`${ing.name} vence antes (${formatNumber(needed)} ${ing.useUnit} sin cubrir)`);
            } else {
              alerts.push(`Faltan ${formatNumber(needed)} ${ing.useUnit} de ${ing.name}`);
            }
          }
        });

        evaluationMap[item.id] = {
          ok: alerts.length === 0,
          alerts
        };
      });

      return evaluationMap;
    }

    function renderScheduledMealCard(meal, evaluation) {
      const recipe = getRecipe(meal.recipeId);

      const isCooked = meal.status === 'cooked';

        'Desayuno': 'bg-sky-50 text-sky-700 border-sky-200',
        'Almuerzo': 'bg-amber-50 text-amber-800 border-amber-200',
        'Cena': 'bg-indigo-50 text-indigo-700 border-indigo-200'

      return `
        <div class="p-3.5 rounded-2xl border ${isCooked ? 'bg-emerald-50/40 border-emerald-200' : (evaluation && !evaluation.ok ? 'bg-rose-50/30 border-rose-200' : 'bg-slate-50/70 border-slate-200/80')} space-y-2.5">

            <div>
              <div class="flex items-center gap-2 flex-wrap">

                <h5 class="font-extrabold text-slate-800 text-sm">${recipe.name}</h5>
                <span class="text-[11px] font-semibold text-slate-400"><i class="fa-regular fa-clock mr-0.5"></i>${recipe.prepTimeMin || 25}m</span>
              </div>
              <p class="text-[11px] text-slate-500 mt-1">
                ${recipe.ingredients.map(i => {
                  const ing = getIngredient(i.ingredientId);
                  return ing ? `${formatNumber(i.qty)} ${ing.useUnit} ${ing.name.toLowerCase()}` : '';
                }).filter(Boolean).join(' · ')}
              </p>
            </div>

            <div class="flex items-center gap-1 shrink-0">
              <button onclick="openRecipeDetailsModal('${recipe.id}')" class="text-slate-400 hover:text-emerald-600 p-2 transition" title="Ver procedimiento y tiempos">
                <i class="fa-solid fa-book-open-reader text-xs"></i>
              </button>
              <button onclick="removeScheduledMeal('${meal.id}')" class="text-slate-300 hover:text-rose-500 p-2 transition" title="Quitar del calendario">
                <i class="fa-solid fa-trash-can text-xs"></i>
              </button>
            </div>
          </div>

          ${!isCooked && evaluation ? (
            evaluation.ok ? `
              <div class="flex items-center gap-1.5 text-[11px] font-bold text-emerald-700 bg-emerald-100/70 px-2.5 py-1.5 rounded-xl">
                <i class="fa-solid fa-circle-check"></i>
                <span>Ingredientes disponibles y frescos para este día</span>
              </div>
            ` : `
              <div class="bg-rose-100/80 border border-rose-200 text-rose-800 px-3 py-2 rounded-xl space-y-1">
                <div class="flex items-center gap-1.5 text-[11px] font-extrabold">
                  <i class="fa-solid fa-triangle-exclamation text-rose-600"></i>
                  <span>Alerta de inventario para este día:</span>
                </div>
                <ul class="text-[11px] font-medium list-disc list-inside space-y-0.5">
                  ${evaluation.alerts.map(a => `<li>${a}</li>`).join('')}

            `
          ) : ''}

          <div class="pt-0.5">
            ${isCooked ? `
              <div class="w-full py-2.5 px-3 rounded-xl bg-emerald-600 text-white text-xs font-bold flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-check-double"></i>
                <span>¡Cocinado! Stock descontado y hábito registrado</span>

              <button onclick="completeScheduledMeal('${meal.id}')" class="w-full py-2.5 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white text-xs font-bold shadow-xs flex items-center justify-center gap-1.5 transition min-h-[42px]">
                <i class="fa-solid fa-fire-burner"></i>
                <span>¡Ya lo cociné! (Descontar y marcar hábito)</span>

    function selectCalendarDate(dateStr) {
      selectedCalendarDate = dateStr;
      renderCurrentTab();
    }

    function toggleNoCookDay(dateStr) {
      if (appState.noCookDays[dateStr]) {
        delete appState.noCookDays[dateStr];
        showToast('Día habilitado para cocinar');

        appState.noCookDays[dateStr] = true;

      saveState();
      renderCurrentTab();

    function removeScheduledMeal(scheduleId) {
      appState.schedule = appState.schedule.filter(s => s.id !== scheduleId);
      saveState();
      renderCurrentTab();
      showToast('Comida quitada del calendario');
    }

    function completeScheduledMeal(scheduleId) {
      const meal = appState.schedule.find(s => s.id === scheduleId);
      if (!meal || meal.status === 'cooked') return;
      const recipe = getRecipe(meal.recipeId);
      if (!recipe) return;

      // Descuento FIFO (primero los lotes más próximos a vencer)
      recipe.ingredients.forEach(req => {
        let toDeduct = req.qty;
        const matchingLots = appState.pantry
          .filter(l => l.ingredientId === req.ingredientId && l.remainingUseQty > 0)
          .sort((a, b) => a.expiryDate.localeCompare(b.expiryDate));

        for (const lot of matchingLots) {
          if (toDeduct <= 0) break;
          if (lot.remainingUseQty >= toDeduct) {
            lot.remainingUseQty = Number((lot.remainingUseQty - toDeduct).toFixed(2));
            toDeduct = 0;
          } else {
            toDeduct = Number((toDeduct - lot.remainingUseQty).toFixed(2));
            lot.remainingUseQty = 0;
          }
        }
      });

      appState.pantry = appState.pantry.filter(l => l.remainingUseQty > 0);
      meal.status = 'cooked';

      const targetDate = meal.date;
      if (!appState.habitLogs[targetDate]) {
        appState.habitLogs[targetDate] = { cooked: true, meals: [recipe.name] };
      } else {
        appState.habitLogs[targetDate].cooked = true;
        if (!appState.habitLogs[targetDate].meals.includes(recipe.name)) {
          appState.habitLogs[targetDate].meals.push(recipe.name);
        }
      }

      saveState();
      renderCurrentTab();
      showToast(`¡Genial! "${recipe.name}" descontado y racha sumada`);
    }

      closeModal();

    /**

    function renderPantryTab(container) {
      const activeLots = appState.pantry
        .filter(lot => lot.remainingUseQty > 0 && getIngredient(lot.ingredientId))
        .map(lot => ({
          ...lot,
          ingredient: getIngredient(lot.ingredientId),
          daysLeft: getDaysRemaining(lot.expiryDate)
        }))
        .sort((a, b) => a.daysLeft - b.daysLeft);

      const totalLots = activeLots.length;
      const expiringSoon = activeLots.filter(l => l.daysLeft >= 0 && l.daysLeft <= 2).length;
      const expiredCount = activeLots.filter(l => l.daysLeft < 0).length;

      const filteredLots = pantryFilter === 'expiring'
        ? activeLots.filter(l => l.daysLeft <= 2)
        : activeLots;

      container.innerHTML = `
        <div class="space-y-4 animate-fade-in">
          <div class="grid grid-cols-3 gap-2.5">
            <div class="bg-white p-3 rounded-2xl border border-slate-200/70 shadow-2xs">
              <div class="text-xs font-medium text-slate-500">En despensa</div>
              <div class="text-xl font-extrabold text-slate-800 mt-0.5">${totalLots} <span class="text-xs font-normal text-slate-400">lotes</span></div>
            </div>
            <div class="bg-amber-50/70 p-3 rounded-2xl border border-amber-200/70 shadow-2xs">
              <div class="text-xs font-semibold text-amber-700">Por vencer</div>
              <div class="text-xl font-extrabold text-amber-600 mt-0.5">${expiringSoon} <span class="text-xs font-normal text-amber-600/70">≤2d</span></div>
            </div>
            <div class="bg-rose-50/70 p-3 rounded-2xl border border-rose-200/70 shadow-2xs">
              <div class="text-xs font-semibold text-rose-700">Vencidos</div>
              <div class="text-xl font-extrabold text-rose-600 mt-0.5">${expiredCount}</div>
            </div>
          </div>

          <button onclick="openAddPurchaseModal()" class="w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 active:scale-[0.99] text-white font-bold shadow-md shadow-emerald-600/20 flex items-center justify-center gap-2 transition min-h-[48px]">
            <i class="fa-solid fa-plus-circle text-lg"></i>
            <span>Registrar Nueva Compra</span>
          </button>

          <div class="flex items-center justify-between pt-1">
            <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider">Inventario por Urgencia</h2>
            <div class="flex bg-slate-200/70 p-1 rounded-xl text-xs font-semibold">
              <button onclick="pantryFilter = 'all'; renderCurrentTab();" class="px-3 py-1.5 rounded-lg transition ${pantryFilter === 'all' ? 'bg-white text-slate-800 shadow-2xs' : 'text-slate-500'}">Todos (${totalLots})</button>
              <button onclick="pantryFilter = 'expiring'; renderCurrentTab();" class="px-3 py-1.5 rounded-lg transition ${pantryFilter === 'expiring' ? 'bg-white text-rose-600 shadow-2xs' : 'text-slate-500'}">Urgentes (${expiringSoon + expiredCount})</button>
            </div>
          </div>

          ${filteredLots.length === 0 ? `
            <div class="bg-white rounded-3xl p-8 text-center border border-slate-200/70">
              <div class="w-14 h-14 rounded-2xl bg-emerald-50 text-emerald-500 flex items-center justify-center mx-auto mb-3 text-2xl">
                <i class="fa-solid fa-leaf"></i>
              </div>
              <h3 class="font-bold text-slate-800">${pantryFilter === 'expiring' ? '¡Nada por malograrse!' : 'Tu despensa está vacía'}</h3>
              <p class="text-sm text-slate-500 mt-1">${pantryFilter === 'expiring' ? 'Todos tus productos tienen buena vida útil.' : 'Registra tus compras para controlar unidades y vencimientos.'}</p>
            </div>
          ` : `
            <div class="space-y-3">
              ${filteredLots.map(lot => renderPantryLotCard(lot)).join('')}
            </div>
          `}
        </div>
      `;
    }

    function renderPantryLotCard(lot) {
      const { ingredient, daysLeft } = lot;
      const catStyle = getCategoryIcon(ingredient.category);

      let statusBadge = '';
      let barColor = 'bg-emerald-500';
      let cardBorder = 'border-slate-200/80';

      if (daysLeft < 0) {
        statusBadge = `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-rose-100 text-rose-700"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Venció hace ${Math.abs(daysLeft)}d</span>`;
        barColor = 'bg-rose-500';
        cardBorder = 'border-rose-300 bg-rose-50/20';
      } else if (daysLeft === 0) {
        statusBadge = `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-rose-100 text-rose-700 animate-pulse"><i class="fa-solid fa-fire mr-1"></i>¡Úsalo hoy!</span>`;
        barColor = 'bg-rose-500';
        cardBorder = 'border-rose-300';
      } else if (daysLeft === 1) {
        statusBadge = `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-rose-100 text-rose-700"><i class="fa-solid fa-clock mr-1"></i>Vence mañana</span>`;
        barColor = 'bg-rose-500';
        cardBorder = 'border-rose-300';
      } else if (daysLeft <= 3) {
        statusBadge = `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800"><i class="fa-solid fa-clock mr-1"></i>Vence en ${daysLeft}d</span>`;
        barColor = 'bg-amber-500';
        cardBorder = 'border-amber-300';
      } else {
        statusBadge = `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-700">Dura ${daysLeft} días</span>`;
        barColor = 'bg-emerald-500';
      }

      const totalShelf = Math.max(1, ingredient.shelfLifeDays);
      const lifePercent = Math.max(4, Math.min(100, Math.round((daysLeft / totalShelf) * 100)));
      const equivBuyQty = formatNumber(lot.remainingUseQty / ingredient.factor);
      const step = ingredient.factor >= 100 ? 50 : 1;

      return `
        <div class="bg-white rounded-2xl p-4 border ${cardBorder} shadow-2xs transition">
          <div class="flex items-start justify-between gap-2">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl ${catStyle.color} flex items-center justify-center shrink-0">
                <i class="fa-solid ${catStyle.icon} text-base"></i>
              </div>
              <div>
                <div class="flex items-center gap-2 flex-wrap">
                  <h3 class="font-bold text-slate-800 text-base leading-tight">${ingredient.name}</h3>
                  ${statusBadge}
                </div>
                <p class="text-xs text-slate-400 mt-0.5">
                  Comprado el ${getDayInfo(lot.purchaseDate).formatted} · Vence ${getDayInfo(lot.expiryDate).formatted}
                </p>
              </div>
            </div>

            <button onclick="deleteLot('${lot.id}')" class="text-slate-300 hover:text-rose-500 p-2 transition" title="Descartar / Se malogró">
              <i class="fa-solid fa-trash-can text-sm"></i>
            </button>
          </div>

          <div class="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between gap-3">
            <div>
              <div class="flex items-baseline gap-1.5">
                <span class="text-xl font-extrabold text-slate-800">${formatNumber(lot.remainingUseQty)}</span>
                <span class="text-xs font-semibold text-slate-600">${ingredient.useUnit}</span>
                ${ingredient.factor !== 1 ? `<span class="text-xs text-slate-400">(~${equivBuyQty} ${ingredient.buyUnit})</span>` : ''}
              </div>
            </div>

            <div class="flex items-center gap-1.5 bg-slate-100 p-1 rounded-xl">
              <button onclick="adjustLotQty('${lot.id}', -${step})" class="w-9 h-9 rounded-lg bg-white text-slate-700 hover:bg-rose-50 hover:text-rose-600 font-bold shadow-2xs flex items-center justify-center active:scale-95 transition">
                <i class="fa-solid fa-minus text-xs"></i>
              </button>
              <span class="text-[11px] font-bold text-slate-500 px-1">±${step}</span>
              <button onclick="adjustLotQty('${lot.id}', ${step})" class="w-9 h-9 rounded-lg bg-white text-slate-700 hover:bg-emerald-50 hover:text-emerald-600 font-bold shadow-2xs flex items-center justify-center active:scale-95 transition">
                <i class="fa-solid fa-plus text-xs"></i>
              </button>
            </div>
          </div>

          <div class="mt-2.5 w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
            <div class="${barColor} h-full rounded-full transition-all duration-300" style="width: ${daysLeft < 0 ? 100 : lifePercent}%"></div>
          </div>
        </div>
      `;
    }

    function adjustLotQty(lotId, delta) {
      const lot = appState.pantry.find(l => l.id === lotId);
      if (!lot) return;
      lot.remainingUseQty = Math.max(0, Number((lot.remainingUseQty + delta).toFixed(2)));
      if (lot.remainingUseQty === 0) {
        appState.pantry = appState.pantry.filter(l => l.id !== lotId);
        showToast('Producto terminado y retirado');
      }
      saveState();
      renderCurrentTab();
    }

    function deleteLot(lotId) {
      appState.pantry = appState.pantry.filter(l => l.id !== lotId);
      saveState();
      renderCurrentTab();
      showToast('Lote retirado de la despensa');
    }

    function openAddPurchaseModal() {
      if (appState.catalog.length === 0) {
        showToast('Primero crea un ingrediente en el Catálogo', 'warning');
        return;
      }
      const firstIng = appState.catalog[0];
      const modalBox = document.getElementById('modal-box');
      modalBox.innerHTML = `
        <div class="p-5 border-b border-slate-100 flex items-center justify-between">
          <h3 class="text-lg font-extrabold text-slate-800">Registrar Compra</h3>
          <button onclick="closeModal()" class="w-9 h-9 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form onsubmit="handleSavePurchase(event)" class="p-5 space-y-4 overflow-y-auto">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1.5">¿Qué compraste?</label>
            <select id="buy-ing-id" onchange="updatePurchasePreview()" class="w-full p-3 rounded-xl border border-slate-300 bg-white font-semibold text-slate-800 focus:outline-hidden focus:border-emerald-500 min-h-[46px]">
              ${appState.catalog.map(ing => `<option value="${ing.id}">${ing.name} (${ing.category})</option>`).join('')}
            </select>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label id="buy-qty-label" class="block text-xs font-bold text-slate-600 uppercase mb-1.5">Cantidad (${firstIng.buyUnit})</label>
              <input type="number" id="buy-qty" step="0.01" min="0.01" value="1" required oninput="updatePurchasePreview()" class="w-full p-3 rounded-xl border border-slate-300 font-bold text-slate-800 focus:outline-hidden focus:border-emerald-500 min-h-[46px]" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1.5">Fecha de compra</label>
              <input type="date" id="buy-date" value="${getTodayStr(0)}" required onchange="updatePurchasePreview()" class="w-full p-3 rounded-xl border border-slate-300 font-semibold text-slate-800 focus:outline-hidden focus:border-emerald-500 min-h-[46px]" />
            </div>
          </div>

          <div id="purchase-preview" class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 space-y-1"></div>

          <div class="pt-2 flex gap-2">
            <button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-slate-100 font-bold text-slate-600 min-h-[44px]">Cancelar</button>
            <button type="submit" class="w-2/3 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow-md shadow-emerald-600/20 min-h-[44px]">Guardar en Despensa</button>
          </div>
        </form>
      `;
      openModal();
      updatePurchasePreview();
    }

    function updatePurchasePreview() {
      const ingId = document.getElementById('buy-ing-id').value;
      const qty = parseFloat(document.getElementById('buy-qty').value) || 0;
      const buyDate = document.getElementById('buy-date').value || getTodayStr(0);
      const ing = getIngredient(ingId);
      if (!ing) return;

      document.getElementById('buy-qty-label').textContent = `Cantidad (${ing.buyUnit})`;
      const convertedQty = formatNumber(qty * ing.factor);
      const expiryDate = addDaysToDateStr(buyDate, ing.shelfLifeDays);
      const daysFromToday = getDaysRemaining(expiryDate);
      const estCost = (qty * (ing.refPrice || 0));

      document.getElementById('purchase-preview').innerHTML = `
        <div class="flex items-center justify-between text-emerald-800 font-bold text-sm">
          <span><i class="fa-solid fa-wand-magic-sparkles text-emerald-600 mr-1.5"></i>Conversión automática:</span>
          ${estCost > 0 ? `<span class="text-xs px-2 py-0.5 rounded-lg bg-white text-emerald-700 font-extrabold">~${formatSoles(estCost)}</span>` : ''}
        </div>
        <p class="text-sm text-emerald-900">
          Se agregarán <strong>~${convertedQty} ${ing.useUnit}</strong> a tu despensa.
        </p>
        <p class="text-xs text-emerald-700">
          Vida útil estimada: <strong>${ing.shelfLifeDays} días</strong> (vence el ${getDayInfo(expiryDate).formatted} · ${daysFromToday >= 0 ? `en ${daysFromToday} días` : 'vencido'}).
        </p>
      `;
    }

    function handleSavePurchase(e) {
      e.preventDefault();
      const ingId = document.getElementById('buy-ing-id').value;
      const buyQty = parseFloat(document.getElementById('buy-qty').value);
      const purchaseDate = document.getElementById('buy-date').value;
      const ing = getIngredient(ingId);
      if (!ing || buyQty <= 0) return;

      const totalUseQty = Number((buyQty * ing.factor).toFixed(2));
      const expiryDate = addDaysToDateStr(purchaseDate, ing.shelfLifeDays);

      appState.pantry.push({
        id: 'lot_' + Date.now(),
        ingredientId: ingId,
        buyQty,
        remainingUseQty: totalUseQty,
        initialUseQty: totalUseQty,
        purchaseDate,
        expiryDate
      });

      saveState();
      closeModal();
      renderCurrentTab();
      showToast(`+${formatNumber(totalUseQty)} ${ing.useUnit} de ${ing.name} agregados`);
    }

    /**
     * ============================================================================
     * PESTAÑA 3: RECETARIO CON PROCEDIMIENTO Y TIEMPOS + CATÁLOGO CON PRECIOS (S/)

     */

      container.innerHTML = `
        <div class="space-y-4 animate-fade-in">
          <div class="grid grid-cols-2 bg-slate-200/80 p-1 rounded-2xl">
            <button onclick="recipesSubTab = 'recipes'; renderCurrentTab();" class="py-2.5 rounded-xl text-xs font-extrabold transition flex items-center justify-center gap-1.5 min-h-[42px] ${
              recipesSubTab === 'recipes' ? 'bg-white text-emerald-700 shadow-xs' : 'text-slate-600'
            }">
              <i class="fa-solid fa-utensils"></i>

          </div>

          ${recipesSubTab === 'recipes' ? renderRecipesSection() : renderCatalogSection()}

    function renderRecipesSection() {
      return `
        <div class="space-y-3.5">
          <div class="flex items-center justify-between gap-2">
            <div>
              <h2 class="text-base font-extrabold text-slate-800">Mis Platos y Apuntes</h2>
              <p class="text-xs text-slate-500">Ingredientes, tiempos y tus trucos de preparación</p>
            </div>
            <button onclick="openRecipeModal()" class="py-2.5 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-sm flex items-center gap-1.5 min-h-[42px] shrink-0">
              <i class="fa-solid fa-plus"></i>
              <span>Nueva Receta</span>
            </button>
          </div>

          ${appState.recipes.map(recipe => {
            let allAvailable = true;
            const ingDetails = recipe.ingredients.map(item => {
              const ing = getIngredient(item.ingredientId);
              if (!ing) return null;
              const available = getTotalStockForIngredient(ing.id);
              const hasEnough = available >= item.qty;
              if (!hasEnough) allAvailable = false;
              return { ing, required: item.qty, available, hasEnough };
            }).filter(Boolean);

            return `
              <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-2xs space-y-3">
                <div class="flex items-start justify-between gap-2">
                  <div>
                    <div class="flex items-center gap-2 flex-wrap">
                      <h3 class="font-extrabold text-slate-800 text-base">${recipe.name}</h3>
                      <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-700">
                        <i class="fa-regular fa-clock text-emerald-600 mr-0.5"></i>${recipe.prepTimeMin || 25} min
                      </span>
                      ${allAvailable
                        ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-700">Stock hoy OK</span>`
                        : `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800">Falta stock hoy</span>`
                      }
                    </div>
                    <p class="text-xs text-slate-400 mt-0.5">${recipe.servings} porciones ${recipe.notes ? `· ${recipe.notes}` : ''}</p>
                  </div>
                  <div class="flex items-center gap-1 shrink-0">
                    <button onclick="openRecipeModal('${recipe.id}')" class="p-2 text-slate-400 hover:text-emerald-600 transition" title="Editar"><i class="fa-solid fa-pen text-xs"></i></button>
                    <button onclick="deleteRecipe('${recipe.id}')" class="p-2 text-slate-400 hover:text-rose-500 transition" title="Eliminar"><i class="fa-solid fa-trash-can text-xs"></i></button>
                  </div>
                </div>

                <div class="bg-slate-50 rounded-xl p-3 space-y-1.5">
                  ${ingDetails.map(d => `
                    <div class="flex items-center justify-between text-xs">
                      <span class="font-semibold text-slate-700">${d.ing.name}</span>
                      <span class="${d.hasEnough ? 'text-slate-600' : 'text-rose-600 font-bold'}">
                        Pide ${formatNumber(d.required)} · Tienes ${formatNumber(d.available)} ${d.ing.useUnit}
                      </span>
                    </div>
                  `).join('')}
                </div>

                <div class="grid grid-cols-2 gap-2">
                  <button onclick="openRecipeDetailsModal('${recipe.id}')" class="py-2.5 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold flex items-center justify-center gap-1.5 transition min-h-[42px]">
                    <i class="fa-solid fa-book-open-reader text-emerald-600"></i>
                    <span>Preparación y pasos</span>
                  </button>
                  <button onclick="quickScheduleRecipe('${recipe.id}')" class="py-2.5 px-3 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-bold flex items-center justify-center gap-1.5 transition min-h-[42px]">
                    <i class="fa-solid fa-calendar-plus"></i>
                    <span>Agendar</span>
                  </button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

        <div class="p-5 border-b border-slate-100 flex items-center justify-between">
          <div>
            <h3 class="text-lg font-extrabold text-slate-800">${recipe.name}</h3>
            <div class="flex items-center gap-3 text-xs text-slate-500 mt-0.5">

              <span><i class="fa-solid fa-utensils mr-1"></i>${recipe.servings} porciones</span>
            </div>
          </div>
          <button onclick="closeModal()" class="w-9 h-9 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="p-5 space-y-4 overflow-y-auto">
          ${recipe.notes ? `
            <div class="bg-amber-50 border border-amber-200/80 rounded-2xl p-3 text-xs text-amber-900 font-medium">
              <i class="fa-solid fa-lightbulb text-amber-500 mr-1.5"></i>${recipe.notes}
            </div>
          ` : ''}

          <div>
            <h4 class="text-xs font-extrabold text-slate-500 uppercase mb-2">Ingredientes exactos</h4>

            </div>

          <div class="pt-1 flex gap-2">

            <button onclick="closeModal(); quickScheduleRecipe('${recipe.id}');" class="w-2/3 py-3 rounded-xl bg-emerald-600 text-white font-bold shadow-sm min-h-[44px]">Agendar en Calendario</button>
          </div>
        </div>
      `;
      openModal();
    }

    function quickScheduleRecipe(recipeId) {
      appState.schedule.push({
        id: 'sch_' + Date.now(),
        date: selectedCalendarDate,
        mealType: 'Almuerzo',
        recipeId,
        status: 'planned'
      });
      if (appState.noCookDays[selectedCalendarDate]) delete appState.noCookDays[selectedCalendarDate];
      saveState();
      switchTab('calendar');
      showToast(`Agendado para ${getDayInfo(selectedCalendarDate).relativeLabel}`);
    }

    function renderCatalogSection() {
      const filtered = appState.catalog.filter(i =>
        i.name.toLowerCase().includes(catalogSearch.toLowerCase()) ||
        i.category.toLowerCase().includes(catalogSearch.toLowerCase())

    function handleSaveRecipe(e, editId) {
      e.preventDefault();

      if (editId) {
        const idx = appState.recipes.findIndex(r => r.id === editId);

      closeModal();
      renderCurrentTab();

    /**
     * ============================================================================
     * PESTAÑA 4: LISTA DE COMPRAS CON PRESUPUESTO EN SOLES (S/) Y EXTRAS DEL HOGAR
     * ============================================================================
     */
    function calculateWeeklyShoppingBalance() {
      const today = getTodayStr(0);
      const endWindow = getTodayStr(6);
      const requiredTotals = {};

      appState.schedule
        .filter(s => s.status === 'planned' && s.date >= today && s.date <= endWindow)
        .forEach(item => {
          const recipe = getRecipe(item.recipeId);
          if (!recipe) return;
          recipe.ingredients.forEach(req => {
            requiredTotals[req.ingredientId] = (requiredTotals[req.ingredientId] || 0) + req.qty;
          });
        });

      const coveredList = [];
      const missingList = [];

      Object.entries(requiredTotals).forEach(([ingId, neededQty]) => {
        const ingredient = getIngredient(ingId);
        if (!ingredient) return;

        const validStockQty = appState.pantry
          .filter(l => l.ingredientId === ingId && l.remainingUseQty > 0 && l.expiryDate >= today)
          .reduce((sum, l) => sum + Number(l.remainingUseQty), 0);

        const deficit = Number((neededQty - validStockQty).toFixed(2));

        if (deficit <= 0) {
          coveredList.push({ ingredient, neededQty, inStockQty: validStockQty });
        } else {
          const rawBuyNeeded = deficit / ingredient.factor;
          const suggestedBuyQty = ingredient.factor === 1
            ? Math.ceil(rawBuyNeeded)
            : Math.ceil(rawBuyNeeded * 4) / 4; // Redondea a cuartos (0.25, 0.5, 0.75, 1)

          const estimatedCost = Number((suggestedBuyQty * (ingredient.refPrice || 0)).toFixed(2));

          missingList.push({
            ingredient,
            neededQty,
            inStockQty: validStockQty,
            deficit,
            suggestedBuyQty,
            estimatedCost
          });
        }
      });

      return { coveredList, missingList };
    }

    function renderShoppingTab(container) {
      const { coveredList, missingList } = calculateWeeklyShoppingBalance();
      const extras = appState.extraShoppingItems || [];

      const checkedFoodCount = missingList.filter(i => appState.checkedShoppingItems[i.ingredient.id]).length;
      const checkedExtrasCount = extras.filter(e => e.checked).length;

      // Cálculo de presupuesto en Soles (S/)

          <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-2xs space-y-3.5">

            ${missingList.length === 0 ? `
              <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-5 text-center space-y-1">
                <i class="fa-solid fa-circle-check text-emerald-500 text-2xl mb-1"></i>
                <div class="text-sm font-extrabold text-emerald-900">¡Ingredientes de recetas cubiertos!</div>

              <div class="divide-y divide-slate-100">
                ${missingList.map(item => {
                  const isChecked = !!appState.checkedShoppingItems[item.ingredient.id];
                  return `
                    <label class="py-3 flex items-center justify-between gap-3 cursor-pointer select-none min-h-[54px]">
                      <div class="flex items-center gap-3">
                        <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="appState.checkedShoppingItems['${item.ingredient.id}'] = !appState.checkedShoppingItems['${item.ingredient.id}']; saveState(); renderCurrentTab();" class="w-5 h-5 rounded-md accent-emerald-600 cursor-pointer shrink-0" />
                        <div class="${isChecked ? 'line-through opacity-50' : ''}">
                          <div class="text-sm font-bold text-slate-800">${item.ingredient.name}</div>
                          <div class="text-xs text-slate-500">
                            Pide ${formatNumber(item.neededQty)} · Tienes ${formatNumber(item.inStockQty)} · <strong class="text-rose-600">Faltan ${formatNumber(item.deficit)} ${item.ingredient.useUnit}</strong>

            </div>

            <!-- Formulario rápido inline para añadir extra sin receta -->
            <form onsubmit="handleAddExtraItem(event)" class="grid grid-cols-12 gap-2 bg-slate-50 p-2.5 rounded-2xl border border-slate-200/80">
              <input type="text" id="extra-name" required placeholder="Ej. Detergente, Sal, Pan..." class="col-span-5 p-2.5 rounded-xl border border-slate-200 bg-white text-xs font-semibold text-slate-800 focus:outline-hidden focus:border-emerald-500 min-h-[42px]" />
              <input type="text" id="extra-qty" placeholder="Cant. (1 un)" class="col-span-3 p-2.5 rounded-xl border border-slate-200 bg-white text-xs font-medium text-slate-700 focus:outline-hidden focus:border-emerald-500 min-h-[42px]" />
              <input type="number" id="extra-price" step="0.10" min="0" placeholder="S/ 0.00" class="col-span-2 p-2.5 rounded-xl border border-slate-200 bg-white text-xs font-bold text-emerald-700 focus:outline-hidden focus:border-emerald-500 min-h-[42px]" />
              <button type="submit" class="col-span-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold flex items-center justify-center shadow-2xs min-h-[42px]" title="Agregar extra">
                <i class="fa-solid fa-plus"></i>
              </button>
            </form>

            ${extras.length === 0 ? `
              <p class="text-xs text-slate-400 text-center py-2">No tienes artículos extra anotados para esta compra.</p>
            ` : `
              <div class="divide-y divide-slate-100">
                ${extras.map(ext => `
                  <div class="py-2.5 flex items-center justify-between gap-2 min-h-[48px]">
                    <label class="flex items-center gap-3 cursor-pointer flex-1 select-none">
                      <input type="checkbox" ${ext.checked ? 'checked' : ''} onchange="toggleExtraItem('${ext.id}')" class="w-5 h-5 rounded-md accent-emerald-600 cursor-pointer shrink-0" />
                      <div class="${ext.checked ? 'line-through opacity-50' : ''}">
                        <div class="text-sm font-bold text-slate-800">${ext.name}</div>
                        ${ext.qtyLabel ? `<div class="text-[11px] text-slate-500">${ext.qtyLabel}</div>` : ''}
                      </div>
                    </label>
                    <div class="flex items-center gap-2 shrink-0">
                      ${ext.estimatedPrice > 0 ? `<span class="text-xs font-extrabold text-emerald-700 bg-emerald-50 px-2 py-1 rounded-lg ${ext.checked ? 'opacity-40' : ''}">${formatSoles(ext.estimatedPrice)}</span>` : ''}
                      <button onclick="deleteExtraItem('${ext.id}')" class="text-slate-300 hover:text-rose-500 p-2 transition" title="Eliminar">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                      </button>
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>

          <!-- 3. LO QUE YA TIENES CUBIERTO EN CASA -->
          ${coveredList.length > 0 ? `
            <div class="bg-emerald-50/70 rounded-3xl p-4 border border-emerald-200/80 space-y-2.5">
              <div class="flex items-center gap-2">
                <i class="fa-solid fa-house-circle-check text-emerald-600"></i>
                <h3 class="text-sm font-extrabold text-emerald-900">Ya tienes en casa (No comprar)</h3>
              </div>
              <div class="space-y-1.5">
                ${coveredList.map(item => `
                  <div class="flex items-center justify-between text-xs bg-white/90 px-3 py-2 rounded-xl">
                    <span class="font-bold text-slate-700">${item.ingredient.name}</span>
                    <span class="text-emerald-700 font-semibold">
                      Pide ${formatNumber(item.neededQty)} · Tienes <strong>${formatNumber(item.inStockQty)} ${item.ingredient.useUnit}</strong>
                    </span>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function handleAddExtraItem(e) {
      e.preventDefault();
      const nameInput = document.getElementById('extra-name');
      const qtyInput = document.getElementById('extra-qty');
      const priceInput = document.getElementById('extra-price');

      const name = nameInput.value.trim();
      if (!name) return;

      appState.extraShoppingItems.push({
        id: 'ext_' + Date.now(),
        name,
        qtyLabel: qtyInput.value.trim() || '1 unid.',
        estimatedPrice: parseFloat(priceInput.value) || 0,
        checked: false
      });

      saveState();
      renderCurrentTab();
      showToast(`"${name}" agregado a tus compras`);
    }

    function toggleExtraItem(id) {
      const item = appState.extraShoppingItems.find(e => e.id === id);
      if (item) {
        item.checked = !item.checked;
        saveState();
        renderCurrentTab();
      }
    }

    function deleteExtraItem(id) {
      appState.extraShoppingItems = appState.extraShoppingItems.filter(e => e.id !== id);
      saveState();
      renderCurrentTab();
    }

    function clearCheckedExtras() {
      appState.extraShoppingItems = appState.extraShoppingItems.filter(e => !e.checked);
      saveState();
      renderCurrentTab();
      showToast('Extras comprados limpiados');
    }

    function moveCheckedToPantry() {
      const { missingList } = calculateWeeklyShoppingBalance();
      const toAdd = missingList.filter(i => appState.checkedShoppingItems[i.ingredient.id]);
      if (toAdd.length === 0) return;

      const today = getTodayStr(0);

      toAdd.forEach(item => {
        const ing = item.ingredient;
        const buyQty = item.suggestedBuyQty;
        const addedUseQty = Number((buyQty * ing.factor).toFixed(2));
        const expiryDate = addDaysToDateStr(today, ing.shelfLifeDays);

        appState.pantry.push({
          id: 'lot_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          ingredientId: ing.id,
          buyQty,
          remainingUseQty: addedUseQty,
          initialUseQty: addedUseQty,
          purchaseDate: today,
          expiryDate
        });

        delete appState.checkedShoppingItems[ing.id];
      });

      saveState();
      renderCurrentTab();
      showToast(`¡${toAdd.length} alimentos ingresados a Mi Despensa!`);
    }

    function copyShoppingListText() {
      const { missingList } = calculateWeeklyShoppingBalance();
      const extras = appState.extraShoppingItems || [];
      if (missingList.length === 0 && extras.length === 0) return;

      let total = 0;
      const lines = ['🥦 *Lista de Mercado - BrocoFood*', ''];

      if (missingList.length > 0) {
        lines.push('*Ingredientes de comidas:*');
        missingList.forEach(item => {
          const mark = appState.checkedShoppingItems[item.ingredient.id] ? '✅' : '⬜';
          const priceStr = item.estimatedCost > 0 ? ` (~${formatSoles(item.estimatedCost)})` : '';
          total += item.estimatedCost;
          lines.push(`${mark} ${item.ingredient.name}: ~${formatNumber(item.suggestedBuyQty)} ${item.ingredient.buyUnit}${priceStr}`);
        });
        lines.push('');
      }

      if (extras.length > 0) {
        lines.push('*Extras del hogar:*');
        extras.forEach(ext => {
          const mark = ext.checked ? '✅' : '⬜';
          const priceStr = ext.estimatedPrice > 0 ? ` (~${formatSoles(ext.estimatedPrice)})` : '';
          total += Number(ext.estimatedPrice) || 0;
          lines.push(`${mark} ${ext.name} (${ext.qtyLabel})${priceStr}`);
        });
        lines.push('');
      }

      if (total > 0) {
        lines.push(`💰 *Presupuesto estimado total:* ${formatSoles(total)}`);
      }

      const textToCopy = lines.join('\n');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textToCopy).then(() => {
          showToast('Lista y presupuesto copiados');
        }).catch(() => fallbackCopyText(textToCopy));
      } else {
        fallbackCopyText(textToCopy);
      }
    }

    function fallbackCopyText(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('Lista y presupuesto copiados');
      } catch (e) {
        showToast('No se pudo copiar automáticamente', 'error');
      }
      document.body.removeChild(ta);
    }

    /**
     * ============================================================================
     * RESPALDO JSON (SINCRONIZACIÓN MANUAL ENTRE IPHONE Y TABLET ANDROID)
     * ============================================================================
     */
    function openBackupModal() {
      const modalBox = document.getElementById('modal-box');
      modalBox.innerHTML = `
        <div class="p-5 border-b border-slate-100 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="text-xl">🥦</span>
            <h3 class="text-lg font-extrabold text-slate-800">Respaldo BrocoFood</h3>
          </div>
          <button onclick="closeModal()" class="w-9 h-9 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="p-5 space-y-4">
          <p class="text-xs text-slate-500 leading-relaxed">
            Descarga tu archivo de datos para enviártelo por WhatsApp o Telegram y cargarlo en tu iPhone o tablet Android en segundos.
          </p>
          <button onclick="exportDataJSON()" class="w-full py-3.5 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm flex items-center justify-center gap-2 shadow-sm min-h-[46px]">
            <i class="fa-solid fa-download"></i>
            <span>Exportar Copia de Seguridad (.json)</span>
          </button>
          <label class="w-full py-3.5 px-4 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm flex items-center justify-center gap-2 cursor-pointer transition min-h-[46px]">
            <i class="fa-solid fa-upload text-emerald-600"></i>
            <span>Importar Copia desde Archivo (.json)</span>
            <input type="file" accept=".json" onchange="importDataJSON(event)" class="hidden" />
          </label>
          <div class="pt-3 border-t border-slate-100">
            <button onclick="appState = getDefaultData(); saveState(); closeModal(); renderCurrentTab(); showToast('Datos de ejemplo de BrocoFood restaurados');" class="w-full py-3 px-4 rounded-xl border border-rose-200 text-rose-600 hover:bg-rose-50 font-bold text-xs flex items-center justify-center gap-1.5 transition min-h-[44px]">
              <i class="fa-solid fa-rotate-left"></i>
              <span>Restaurar datos de ejemplo iniciales</span>
            </button>
          </div>
        </div>
      `;
      openModal();
    }

    function exportDataJSON() {
      const blob = new Blob([JSON.stringify(appState, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `BrocoFood_${getTodayStr(0)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Copia de BrocoFood descargada');
    }

    function importDataJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed && Array.isArray(parsed.catalog) && Array.isArray(parsed.pantry)) {
            appState = parsed;
            saveState();
            closeModal();
            renderCurrentTab();
            showToast('Datos importados correctamente');
          } else {
            showToast('Archivo inválido', 'error');
          }
        } catch (err) {
          showToast('Error al leer el archivo', 'error');
        }
      };
      reader.readAsText(file);
    }

    function openModal() {
      document.getElementById('modal-container').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-container').classList.add('hidden');
    }

    document.getElementById('modal-container').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    window.addEventListener('DOMContentLoaded', () => {
      setupBrocoFoodPWAIcons();
      renderCurrentTab();
    });
  </script>
</body>
</html>
